<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quixx">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Quixx</title>
<style>
/* Navy Research auf dem Handy: weißer Grund, helle Karten, ein Navy.
   Eine Spalte, Würfel oben, Daumen-Button unten. Alle Ecken eckig, keine Schatten. */
:root {
  --sans: "Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bg: #ffffff;          /* white */
  --surface: #f4f6f8;     /* card */
  --text: #0d1b2a;        /* dark */
  --body: #1a2c42;        /* navy */
  --small: #3a4a5c;       /* slate */
  --muted: #6a7d93;       /* gray, nur Labels */
  --rule: #d6dce4;        /* line */
  --accent: #1a2c42;      /* navy */
  --on-accent: #ffffff;
  --emph: #1a2c42;        /* Summen-Kachel */
  --on-emph: #ffffff;
  --emph-label: #b8c4d4;  /* light-blue auf navy */
  --th-bg: #1a2c42;
  --th-fg: #ffffff;
  --focus: #4a6fa5;
  --white-die-edge: #b8c4d4;

  /* Quixx-Farben: rot, grün, blau aus dem System, gelb ergänzt */
  --q-red: #c0392b;
  --q-yellow: #e2b33c;
  --q-green: #2e8b6e;
  --q-blue: #4a6fa5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1b2a; --surface: #1a2c42; --text: #ffffff; --body: #dde3ea; --small: #dde3ea;
    --muted: #b8c4d4; --rule: #6a7d93; --accent: #ffffff; --on-accent: #0d1b2a;
    --emph: #1a2c42; --on-emph: #ffffff; --emph-label: #b8c4d4;
    --th-bg: #b8c4d4; --th-fg: #0d1b2a; --focus: #b8c4d4; --white-die-edge: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1b2a; --surface: #1a2c42; --text: #ffffff; --body: #dde3ea; --small: #dde3ea;
  --muted: #b8c4d4; --rule: #6a7d93; --accent: #ffffff; --on-accent: #0d1b2a;
  --emph: #1a2c42; --on-emph: #ffffff; --emph-label: #b8c4d4;
  --th-bg: #b8c4d4; --th-fg: #0d1b2a; --focus: #b8c4d4; --white-die-edge: #ffffff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.app {
  display: flex; flex-direction: column; height: 100%; height: 100dvh;
  max-width: 560px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  user-select: none; -webkit-user-select: none;
}

.head { padding-block: 16px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; color: var(--text); }
.meta { font-size: 14px; color: var(--small); white-space: nowrap; }

main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 8px 16px; }
.mode { display: flex; flex-direction: column; gap: 20px; }

.label {
  font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}

.die-btn {
  display: grid; gap: 8px; justify-items: stretch;
  padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 0;
}
.die {
  width: 100%; aspect-ratio: 1; max-width: 100%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  padding: 14%;
}
.pip { width: 72%; aspect-ratio: 1; border-radius: 50%; place-self: center; background: var(--pip); opacity: 0; }
.pip.on { opacity: 1; }
.die.blank .pip { opacity: 0; }
.die-name {
  font-size: 14px; font-weight: 700; text-align: center; color: var(--body);
  min-height: 1.4em; line-height: 1.4em;
}

.die.white  { background: #ffffff; --pip: #0d1b2a; outline: 2px solid var(--white-die-edge); outline-offset: -2px; }
.die.red    { background: var(--q-red);    --pip: #ffffff; }
.die.yellow { background: var(--q-yellow); --pip: #0d1b2a; }
.die.green  { background: var(--q-green);  --pip: #ffffff; }
.die.blue   { background: var(--q-blue);   --pip: #ffffff; }
.die-btn.locked .die { opacity: .22; }
.die-btn.locked .die-name { color: var(--muted); text-decoration: line-through; }

.die.rolling { animation: tumble .48s cubic-bezier(.3,.7,.4,1); }
@keyframes tumble {
  0%   { transform: none; }
  20%  { transform: translateY(-8px) rotate(-16deg) scale(.9); }
  50%  { transform: translateY(2px) rotate(11deg) scale(1.04); }
  75%  { transform: rotate(-4deg); }
  100% { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .die.rolling { animation: none; }
}

.qwhite { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
.qcolor { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.sum {
  aspect-ratio: 1; background: var(--emph); color: var(--on-emph);
  display: grid; align-content: center; justify-items: center; gap: 2px; padding: 8px;
}
.sum .label { color: var(--emph-label); font-size: 11px; text-align: center; }
.sum .big { font-size: 48px; font-weight: 700; line-height: 1; }

.hint { margin: 0; font-size: 15px; color: var(--small); }

table { width: 100%; border-collapse: collapse; font-size: 17px; }
th {
  background: var(--th-bg); color: var(--th-fg); font-weight: 700; font-size: 13px;
  letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; text-align: right;
}
th:first-child, td:first-child { text-align: left; }
td { padding: 10px 12px; text-align: right; border-bottom: 2px solid var(--rule); color: var(--body); }
tbody tr:nth-child(even) td { background: var(--surface); }
td.num { font-size: 22px; font-weight: 700; color: var(--text); }
td.num.off { color: var(--muted); font-weight: 400; }
.swatch { display: inline-block; width: 14px; height: 14px; margin-right: 10px; vertical-align: -1px; }
.swatch.red { background: var(--q-red); }
.swatch.yellow { background: var(--q-yellow); }
.swatch.green { background: var(--q-green); }
.swatch.blue { background: var(--q-blue); }

.bar {
  display: grid; grid-template-columns: 1fr;
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  border-top: 2px solid var(--rule);
}
.btn {
  min-height: 68px; border: 0; border-radius: 0; cursor: pointer;
  font-size: 19px; font-weight: 700; padding: 0 10px; line-height: 1.15;
  transition: transform .08s ease;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .38; cursor: default; }
.btn-primary { background: var(--accent); color: var(--on-accent); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 700px) {
  .head { padding-block: 10px 8px; }
  .mode { gap: 14px; }
  .btn { min-height: 60px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>Quixx</h1>
    <span class="meta">2 weiße · 4 farbige</span>
  </header>

  <main>
    <section class="mode" aria-label="Quixx">
      <div class="qwhite" id="q-white">
        <div class="sum" aria-live="polite">
          <span class="label">Weiß + Weiß</span>
          <span class="big" id="q-sum">–</span>
        </div>
      </div>

      <div class="qcolor" id="q-color"></div>

      <p class="hint">Ist eine Farbreihe geschlossen, tippe den Farbwürfel an, um ihn wegzulegen.</p>

      <div>
        <table aria-label="Kombinationen aus weißem und farbigem Würfel">
          <thead>
            <tr><th scope="col">Farbe</th><th scope="col">Weiß 1 +</th><th scope="col">Weiß 2 +</th></tr>
          </thead>
          <tbody id="q-table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="bar">
    <button class="btn btn-primary" id="q-roll">Alle 6 würfeln</button>
  </footer>

  <div class="sr-only" aria-live="polite" id="announce"></div>
</div>

<script>
(function () {
  "use strict";

  /* Zufall: crypto.getRandomValues liefert Zufall aus dem Betriebssystem.
     Bytes ab 252 werden verworfen, damit 0–251 sich glatt auf 6 Seiten
     verteilt (252 = 6 × 42) und keine Augenzahl bevorzugt wird. */
  var buf = new Uint8Array(1);
  function rollD6() {
    if (window.crypto && crypto.getRandomValues) {
      do { crypto.getRandomValues(buf); } while (buf[0] >= 252);
      return (buf[0] % 6) + 1;
    }
    return Math.floor(Math.random() * 6) + 1;
  }
  function flickerD6() { return Math.floor(Math.random() * 6) + 1; } // nur für die Animation

  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NAMES = ["", "Eins", "Zwei", "Drei", "Vier", "Fünf", "Sechs"];
  var FACES = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  function makeDie(colorClass) {
    var d = document.createElement("div");
    d.className = "die blank " + colorClass;
    d.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 9; i++) {
      var p = document.createElement("span");
      p.className = "pip";
      d.appendChild(p);
    }
    return d;
  }
  function showFace(die, v) {
    var on = FACES[v] || [];
    die.classList.toggle("blank", !v);
    for (var i = 0; i < 9; i++) die.children[i].classList.toggle("on", on.indexOf(i) !== -1);
  }

  // Kurze Würfelanimation: Augen flackern, dann landet der echte Wert.
  function tumble(dice, finals, done) {
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    if (reduceMotion) {
      dice.forEach(function (d, k) { showFace(d, finals[k]); });
      done();
      return;
    }
    dice.forEach(function (d) { d.classList.remove("rolling"); void d.offsetWidth; d.classList.add("rolling"); });
    var iv = setInterval(function () { dice.forEach(function (d) { showFace(d, flickerD6()); }); }, 65);
    setTimeout(function () {
      clearInterval(iv);
      dice.forEach(function (d, k) { showFace(d, finals[k]); d.classList.remove("rolling"); });
      done();
    }, 480);
  }

  var announce = document.getElementById("announce");
  function say(text) { announce.textContent = ""; setTimeout(function () { announce.textContent = text; }, 30); }

  var COLORS = [
    { key: "red", name: "Rot" },
    { key: "yellow", name: "Gelb" },
    { key: "green", name: "Grün" },
    { key: "blue", name: "Blau" }
  ];
  var Q = { w: [0, 0], c: { red: 0, yellow: 0, green: 0, blue: 0 }, locked: {}, busy: false };

  var qWhite = document.getElementById("q-white");
  var qSumTile = qWhite.firstElementChild;
  var qWhiteDice = [];
  [0, 1].forEach(function (n) {
    var box = document.createElement("div");
    box.className = "die-btn";
    var d = makeDie("white");
    var name = document.createElement("span");
    name.className = "die-name";
    name.textContent = "Weiß " + (n + 1);
    box.appendChild(d);
    box.appendChild(name);
    qWhite.insertBefore(box, qSumTile);
    qWhiteDice.push(d);
  });

  var qColor = document.getElementById("q-color");
  var qColorDice = {}, qColorBtns = {};
  COLORS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "die-btn";
    b.setAttribute("aria-pressed", "false");
    var d = makeDie(c.key);
    var name = document.createElement("span");
    name.className = "die-name";
    name.textContent = c.name;
    b.appendChild(d);
    b.appendChild(name);
    b.addEventListener("click", function () {
      if (Q.busy) return;
      Q.locked[c.key] = !Q.locked[c.key];
      render();
      say(c.name + (Q.locked[c.key] ? " weggelegt." : " wieder im Spiel."));
    });
    qColor.appendChild(b);
    qColorDice[c.key] = d;
    qColorBtns[c.key] = b;
  });

  var qTable = document.getElementById("q-table");
  var qCells = {};
  COLORS.forEach(function (c) {
    var tr = document.createElement("tr");
    var name = document.createElement("td");
    name.innerHTML = '<span class="swatch ' + c.key + '"></span>' + c.name;
    var a = document.createElement("td"); a.className = "num";
    var b = document.createElement("td"); b.className = "num";
    tr.appendChild(name); tr.appendChild(a); tr.appendChild(b);
    qTable.appendChild(tr);
    qCells[c.key] = [a, b];
  });

  var qSum = document.getElementById("q-sum");
  var qRoll = document.getElementById("q-roll");

  function render() {
    var rolled = Q.w[0] > 0;
    qSum.textContent = rolled ? Q.w[0] + Q.w[1] : "–";
    COLORS.forEach(function (c) {
      var locked = !!Q.locked[c.key];
      var btn = qColorBtns[c.key];
      btn.classList.toggle("locked", locked);
      btn.setAttribute("aria-pressed", locked ? "true" : "false");
      btn.setAttribute("aria-label", c.name + ": " +
        (locked ? "weggelegt" : (Q.c[c.key] ? NAMES[Q.c[c.key]] : "noch nicht gewürfelt")) +
        ". Antippen zum " + (locked ? "Zurückholen" : "Weglegen") + ".");
      var v = Q.c[c.key];
      var show = rolled && v && !locked;
      qCells[c.key][0].textContent = show ? Q.w[0] + v : "–";
      qCells[c.key][1].textContent = show ? Q.w[1] + v : "–";
      qCells[c.key][0].classList.toggle("off", !show);
      qCells[c.key][1].classList.toggle("off", !show);
    });
    var active = COLORS.filter(function (c) { return !Q.locked[c.key]; }).length + 2;
    qRoll.textContent = active === 6 ? "Alle 6 würfeln" : active + " Würfel würfeln";
    qRoll.disabled = Q.busy;
  }

  qRoll.addEventListener("click", function () {
    if (Q.busy) return;
    var dice = qWhiteDice.slice();
    var keys = COLORS.filter(function (c) { return !Q.locked[c.key]; }).map(function (c) { return c.key; });
    keys.forEach(function (k) { dice.push(qColorDice[k]); });
    var finals = dice.map(function () { return rollD6(); });
    Q.busy = true;
    render();
    tumble(dice, finals, function () {
      Q.w = [finals[0], finals[1]];
      keys.forEach(function (k, n) { Q.c[k] = finals[n + 2]; });
      COLORS.forEach(function (c) { if (Q.locked[c.key]) { Q.c[c.key] = 0; showFace(qColorDice[c.key], 0); } });
      Q.busy = false;
      render();
      say("Weiß " + Q.w[0] + " und " + Q.w[1] + ", Summe " + (Q.w[0] + Q.w[1]) + ".");
    });
  });

  render();

  // Offline-Speicher: lädt die App einmal komplett aufs Gerät
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
