<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortbombe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Wortbombe</title>
<style>
/* Navy Research für ein Handy, das flach zwischen zwei Spielern liegt.
   Rahmen aus 24 Buchstaben, in der Mitte Uhr und Kategorie. Die obere Hälfte steht auf dem Kopf,
   damit die Person gegenüber mitlesen kann. Eckig, ein Navy, Rot nur für die Explosion. */
:root {
  --sans: "Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bg: #ffffff;          /* white */
  --surface: #f4f6f8;     /* card */
  --text: #0d1b2a;        /* dark */
  --body: #1a2c42;        /* navy */
  --small: #3a4a5c;       /* slate */
  --muted: #6a7d93;       /* gray, nur Labels */
  --rule: #d6dce4;        /* line */
  --accent: #1a2c42;      /* navy */
  --on-accent: #ffffff;
  --clock: #1a2c42;
  --clock-mark: #b8c4d4;
  --red: #c0392b;         /* nur: Explosion, verlorene Runde */
  --overlay: rgba(13, 27, 42, .5);
  --focus: #4a6fa5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1b2a; --surface: #1a2c42; --text: #ffffff; --body: #dde3ea; --small: #dde3ea;
    --muted: #b8c4d4; --rule: #6a7d93; --accent: #ffffff; --on-accent: #0d1b2a;
    --clock: #1a2c42; --clock-mark: #b8c4d4; --red: #e0574a; --overlay: rgba(0, 0, 0, .6); --focus: #b8c4d4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1b2a; --surface: #1a2c42; --text: #ffffff; --body: #dde3ea; --small: #dde3ea;
  --muted: #b8c4d4; --rule: #6a7d93; --accent: #ffffff; --on-accent: #0d1b2a;
  --clock: #1a2c42; --clock-mark: #b8c4d4; --red: #e0574a; --overlay: rgba(0, 0, 0, .6); --focus: #b8c4d4;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.35; overflow: hidden;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Spielfeld: Rahmen aus Buchstaben, Raster je nach Ausrichtung 6×8 oder 8×6 */
.board {
  --cols: 6; --rows: 8;
  height: 100%; height: 100dvh;
  display: grid; gap: 6px;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
  padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px))
           max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.board.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
  10%, 90% { transform: translate(-2px, 1px); }
  20%, 80% { transform: translate(4px, -2px); }
  30%, 50%, 70% { transform: translate(-7px, 3px); }
  40%, 60% { transform: translate(7px, -3px); }
}

.letter {
  min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0;
  background: var(--surface); color: var(--text); cursor: pointer;
  font-size: clamp(22px, 7.5vmin, 38px); font-weight: 700; line-height: 1;
  display: grid; place-items: center;
  transition: opacity .25s ease, background-color .12s ease;
}
.letter span { display: block; }
.letter.up span { transform: rotate(180deg); }
.letter:active:not(.used) { background: var(--accent); color: var(--on-accent); }
.letter.used { opacity: .16; cursor: default; }
.board.idle .letter:not(.used) { opacity: .55; }

/* Mitte: zwei Hälften für die beiden Seiten, dazwischen die Uhr */
.center {
  grid-row: 2 / var(--rows); grid-column: 2 / var(--cols);
  min-width: 0; min-height: 0;
  display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px;
  padding: 6px 4px;
}
.half {
  min-width: 0; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 8px; text-align: center;
}
.half.up { transform: rotate(180deg); }
.label {
  margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.label.red { color: var(--red); }
.cat {
  margin: 0; font-size: clamp(19px, 5.4vmin, 27px); font-weight: 700; line-height: 1.15;
  text-wrap: balance; max-width: 100%; overflow-wrap: anywhere;
}
.line { margin: 0; font-size: 15px; color: var(--small); text-wrap: balance; }
.line strong { color: var(--text); }
.score { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip {
  display: inline-block; padding: 5px 10px; border: 2px solid var(--accent);
  font-size: 14px; font-weight: 700; color: var(--text); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip.on { background: var(--accent); color: var(--on-accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.small-btn {
  min-height: 38px; padding: 0 12px; border: 2px solid var(--accent); border-radius: 0;
  background: transparent; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer;
}
.small-btn.fill { background: var(--accent); color: var(--on-accent); }
.mode { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--accent); }
.mode button {
  min-height: 36px; padding: 0 10px; border: 0; border-radius: 0; background: transparent; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--body); white-space: nowrap;
}
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Uhr: kreisender Zeiger, aber keine Restzeit */
.clock {
  justify-self: center; align-self: center;
  width: min(150px, 34vmin); aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%;
  background: var(--clock); position: relative; cursor: pointer;
  display: grid; place-items: center;
}
.clock .hand {
  position: absolute; left: 50%; bottom: 50%; width: 4px; height: 38%; margin-left: -2px;
  background: #ffffff; transform-origin: 50% 100%;
}
.clock .hub { position: absolute; left: 50%; top: 50%; width: 12%; aspect-ratio: 1; border-radius: 50%; background: #ffffff; transform: translate(-50%, -50%); }
.clock .say {
  position: relative; z-index: 1; padding: 4px 10px; background: var(--clock);
  color: #ffffff; font-size: 16px; font-weight: 700; letter-spacing: .04em;
}
.clock.run .hand { animation: spin 1.2s linear infinite; }
.clock.run { animation: pulse 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(1.035); } }
.clock.gone { visibility: hidden; }

/* Explosion */
#flash { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: var(--red); opacity: 0; }
#fx { position: fixed; inset: 0; z-index: 21; pointer-events: none; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {
  .clock.run, .clock.run .hand, .board.shake { animation: none; }
}

/* Querformat: Uhr in der Mitte, Kategorie links und rechts daneben */
@media (orientation: landscape) {
  .center { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; padding: 2px 6px; }
  .clock { width: min(150px, 40vmin); }
  .cat { font-size: clamp(17px, 5vmin, 24px); }
}

/* Einstellungen */
.overlay {
  position: fixed; inset: 0; z-index: 30; background: var(--overlay);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.panel {
  width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--bg);
  padding: 20px; display: grid; gap: 12px;
}
.panel h2 { margin: 0; font-size: 24px; }
.panel .mode button { min-height: 46px; font-size: 15px; }
.mode.three { grid-template-columns: 1fr 1fr 1fr; }
.note { margin: 0; font-size: 14px; color: var(--small); }
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.prow input {
  min-height: 48px; width: 100%; padding: 0 12px; font: inherit; font-size: 17px; color: var(--text);
  background: var(--bg); border: 2px solid var(--rule); border-radius: 0; user-select: text; -webkit-user-select: text;
}
.btn {
  min-height: 52px; border: 0; border-radius: 0; cursor: pointer; font-size: 17px; font-weight: 700;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface); color: var(--text); }
.btn:disabled { opacity: .4; cursor: default; }
.confirm { background: var(--surface); padding: 12px; display: grid; gap: 10px; }
.confirm p { margin: 0; font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="board idle" id="board" aria-label="Wortbombe">
  <div class="center" id="center">
    <section class="half up" id="half-up" aria-hidden="true"></section>
    <button type="button" class="clock" id="clock" aria-label="Uhr: Runde starten">
      <span class="hand" aria-hidden="true"></span>
      <span class="hub" aria-hidden="true"></span>
      <span class="say" id="clock-say">Start</span>
    </button>
    <section class="half" id="half-down"></section>
  </div>
</main>

<div id="flash" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="overlay" id="settings" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Einstellungen</h2>
    <p class="label">Spielweise</p>
    <div class="mode" id="set-mode">
      <button type="button" data-mode="turn">Zeit pro Zug</button>
      <button type="button" data-mode="round">Zeit pro Runde</button>
    </div>
    <p class="note" id="mode-note"></p>
    <p class="label">Tempo</p>
    <div class="mode three" id="set-tempo">
      <button type="button" data-tempo="schnell">Schnell</button>
      <button type="button" data-tempo="normal">Normal</button>
      <button type="button" data-tempo="entspannt">Entspannt</button>
    </div>
    <p class="label">Ton</p>
    <div class="mode" id="set-sound">
      <button type="button" data-sound="1">An</button>
      <button type="button" data-sound="0">Aus</button>
    </div>
    <p class="label">Spieler</p>
    <div class="plist" id="plist"></div>
    <button type="button" class="btn btn-secondary" id="p-add">Spieler hinzufügen</button>
    <button type="button" class="btn btn-secondary" id="reset">Punkte auf 0 setzen</button>
    <div class="confirm" id="confirm" hidden>
      <p>Alle Punkte löschen?</p>
      <div class="two">
        <button type="button" class="btn btn-secondary" id="confirm-no">Abbrechen</button>
        <button type="button" class="btn btn-primary" id="confirm-yes">Ja, auf 0</button>
      </div>
    </div>
    <button type="button" class="btn btn-primary" id="settings-done">Fertig</button>
  </div>
</div>

<div class="sr-only" aria-live="polite" id="announce"></div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- Zufall aus dem Betriebssystem, ohne Verzerrung ---------- */
  var u32 = new Uint32Array(1);
  function randInt(n) {                     // 0 … n-1
    if (!(window.crypto && crypto.getRandomValues)) return Math.floor(Math.random() * n);
    var limit = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(u32); } while (u32[0] >= limit);
    return u32[0] % n;
  }
  function randBetween(a, b) { return a + randInt(b - a + 1); }

  /* ---------- Spielmaterial ---------- */
  var LETTERS = "ABCDEFGHIJKLMNOPRSTUVWYZ".split("");   // 24 Tasten, ohne Q und X
  var TEMPO = {                                          // Sekunden, geheim gezogen
    schnell:   { turn: [5, 8],   round: [30, 60] },
    normal:    { turn: [8, 12],  round: [45, 90] },
    entspannt: { turn: [12, 16], round: [60, 120] }
  };
  var CATEGORIES = [
    "Tiere", "Haustiere", "Tiere im Wasser", "Vögel", "Insekten", "Tiere im Zoo", "Tiere auf dem Bauernhof",
    "Obst", "Gemüse", "Obst oder Gemüse", "Gewürze und Kräuter", "Süßigkeiten", "Kuchen und Gebäck", "Gerichte",
    "Frühstück", "Getränke", "Cocktails", "Käsesorten", "Brot und Brötchen", "Nudelsorten", "Eissorten",
    "Dinge in der Küche", "Dinge im Kühlschrank", "Dinge im Badezimmer", "Dinge im Schlafzimmer",
    "Dinge im Wohnzimmer", "Dinge im Garten", "Dinge im Keller", "Dinge in der Schule", "Dinge im Büro",
    "Dinge im Supermarkt", "Dinge am Strand", "Dinge im Koffer", "Dinge in der Handtasche", "Werkzeuge",
    "Möbel", "Elektrogeräte", "Dinge, die man aufladen kann", "Dinge, die man verschenken kann",
    "Dinge, die rund sind", "Dinge, die rot sind", "Dinge, die grün sind", "Dinge, die weiß sind",
    "Dinge, die fliegen", "Dinge, die stinken", "Dinge, die klebrig sind", "Dinge, die man faltet",
    "Dinge, die Räder haben", "Dinge, die man im Winter braucht", "Dinge mit Knöpfen", "Dinge aus Holz",
    "Dinge aus Metall", "Dinge aus Glas", "Dinge, die kaputtgehen können", "Dinge, die man sammelt",
    "Kleidung", "Schuhe", "Accessoires", "Stoffe und Materialien", "Farben", "Formen",
    "Berufe", "Berufe mit Uniform", "Hobbys", "Sportarten", "Ballsportarten", "Wintersport",
    "Sportgeräte", "Fußballvereine", "Olympische Disziplinen", "Brettspiele und Kartenspiele",
    "Musikinstrumente", "Musikrichtungen", "Bands und Musiker", "Lieder", "Tänze",
    "Filme", "Serien", "Zeichentrickfiguren", "Superhelden", "Märchen und Märchenfiguren",
    "Bücher", "Comicfiguren", "Schauspieler", "Prominente", "Sportler", "Berühmte Deutsche",
    "Historische Persönlichkeiten", "Vornamen", "Mädchennamen", "Jungennamen", "Nachnamen",
    "Länder", "Länder in Europa", "Hauptstädte", "Städte in Deutschland", "Städte weltweit",
    "Flüsse", "Berge und Gebirge", "Inseln", "Sehenswürdigkeiten", "Urlaubsziele",
    "Bundesländer und Regionen", "Sprachen", "Automarken", "Marken", "Modemarken", "Supermärkte und Läden",
    "Fahrzeuge", "Dinge am Flughafen", "Dinge im Krankenhaus", "Dinge im Zirkus", "Dinge auf dem Bauernhof",
    "Dinge im Weltall", "Wetter", "Naturerscheinungen", "Blumen", "Bäume", "Pflanzen",
    "Körperteile", "Krankheiten", "Gefühle", "Charaktereigenschaften", "Adjektive",
    "Verben", "Dinge, die man tut, wenn man müde ist", "Gründe, zu spät zu kommen", "Ausreden",
    "Schimpfwörter, aber nett", "Komplimente", "Dinge, die man nicht sagen sollte", "Dinge, die Babys tun",
    "Feiertage und Feste", "Dinge an Weihnachten", "Dinge an Ostern", "Dinge auf einer Party",
    "Dinge auf einer Hochzeit", "Dinge im Kino", "Dinge im Fitnessstudio", "Dinge beim Camping",
    "Apps und Webseiten", "Computerbegriffe", "Spiele", "Videospiele", "Spielzeug",
    "Wörter mit doppeltem Buchstaben", "Wörter mit mehr als acht Buchstaben", "Englische Wörter",
    "Fremdwörter", "Abkürzungen", "Dinge, die man zählen kann", "Dinge, die laut sind", "Dinge, die leise sind",
    "Dinge, die man trinken kann", "Dinge, die man essen kann", "Dinge, die man nicht essen sollte",
    "Mythologische Wesen", "Gruselige Dinge", "Dinge im Märchenwald", "Fantasiefiguren",
    "Erfindungen", "Chemische Elemente", "Schulfächer", "Mathematische Begriffe", "Planeten und Sterne",
    "Kosenamen", "Dinge, die man im Bett macht", "Dinge, die Paare streiten lassen", "Dinge, die man teilt"
  ];

  /* ---------- Einstellungen und Punkte (bleiben gespeichert) ---------- */
  var KEY = "wortbombe-v1";
  function freshP() {
    return { v: 1, players: ["Spieler 1", "Spieler 2"], scores: [0, 0], mode: "turn", tempo: "normal", sound: true, starter: 0, deck: [], deckPos: 0 };
  }
  function load() {
    try {
      var p = JSON.parse(localStorage.getItem(KEY));
      if (p && p.v === 1 && Array.isArray(p.players) && p.players.length >= 2 &&
          Array.isArray(p.scores) && p.scores.length === p.players.length && TEMPO[p.tempo]) return p;
    } catch (e) {}
    return freshP();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
  var P = load();

  // Kategorien als gemischter Stapel: keine Wiederholung, bis alle einmal dran waren
  function nextCategory() {
    if (!Array.isArray(P.deck) || P.deck.length !== CATEGORIES.length || P.deckPos >= P.deck.length) {
      P.deck = CATEGORIES.map(function (_, i) { return i; });
      for (var i = P.deck.length - 1; i > 0; i--) { var j = randInt(i + 1), t = P.deck[i]; P.deck[i] = P.deck[j]; P.deck[j] = t; }
      P.deckPos = 0;
    }
    var c = CATEGORIES[P.deck[P.deckPos++]];
    save();
    return c;
  }

  /* ---------- Runde ---------- */
  // phase: idle (vor dem Start) · run · pause · boom (abgelaufen)
  var R = { phase: "idle", cat: nextCategory(), used: {}, cur: P.starter % P.players.length, alive: [], loser: -1, winner: -1, deadline: 0, left: 0, flash: "" };
  function resetAlive() { R.alive = P.players.map(function (_, i) { return i; }); }
  resetAlive();

  function secondsFor(kind) { var r = TEMPO[P.tempo][kind]; return randBetween(r[0], r[1]); }

  /* ---------- Ton (wird erst nach dem ersten Tippen erzeugt) ---------- */
  var ac = null;
  function audio() {
    if (!P.sound) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  var tickHigh = false;
  function tick() {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = "square"; o.frequency.value = (tickHigh = !tickHigh) ? 1650 : 1250;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.06);
  }
  function boomSound() {
    var a = audio(); if (!a) return;
    var t = a.currentTime, len = Math.floor(a.sampleRate * 1.3), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    var n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    n.buffer = buf; f.type = "lowpass"; f.frequency.setValueAtTime(1600, t); f.frequency.exponentialRampToValueAtTime(120, t + 1.1);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.25);
    n.connect(f); f.connect(g); g.connect(a.destination); n.start(t);
    var o = a.createOscillator(), og = a.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.7);
    og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(og); og.connect(a.destination); o.start(t); o.stop(t + 0.85);
  }

  /* ---------- Bildschirm wach halten, solange die Runde läuft ---------- */
  var wake = null;
  function keepAwake(on) {
    try {
      if (on && !wake && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }).catch(function () {});
      } else if (!on && wake) { wake.release().catch(function () {}); wake = null; }
    } catch (e) {}
  }

  /* ---------- Uhr ---------- */
  var timer = 0, ticker = 0;
  function arm(seconds) {
    clearTimeout(timer);
    R.deadline = Date.now() + seconds * 1000;
    timer = setTimeout(expire, seconds * 1000);
  }
  function startTicking() { clearInterval(ticker); tick(); ticker = setInterval(tick, 500); }
  function stopClock() { clearTimeout(timer); clearInterval(ticker); }

  function start() {
    audio();
    R.phase = "run";
    arm(secondsFor(P.mode === "turn" ? "turn" : "round"));
    startTicking(); keepAwake(true);
    render();
    say(P.players[R.cur] + " beginnt. Kategorie: " + R.cat + ".");
  }
  function pause() {
    if (R.phase !== "run") return;
    R.left = Math.max(500, R.deadline - Date.now());
    stopClock(); R.phase = "pause"; keepAwake(false);
    render(); say("Pause.");
  }
  function resume() {
    audio();
    R.phase = "run";
    clearTimeout(timer); R.deadline = Date.now() + R.left; timer = setTimeout(expire, R.left);
    startTicking(); keepAwake(true);
    render(); say("Weiter.");
  }
  function nextAlive(from) {
    var i = R.alive.indexOf(from);
    if (i === -1) {  // from ist gerade ausgeschieden: nächster nach ihm in Sitzreihenfolge
      for (var k = 1; k <= P.players.length; k++) { var c = (from + k) % P.players.length; if (R.alive.indexOf(c) !== -1) return c; }
    }
    return R.alive[(i + 1) % R.alive.length];
  }

  function pressLetter(L, btn) {
    if (R.phase === "pause") { resume(); return; }
    if (R.phase !== "run") { say(R.phase === "idle" ? "Erst die Uhr antippen, dann geht es los." : ""); return; }
    if (R.used[L]) return;
    R.used[L] = true;
    btn.classList.add("used");
    btn.setAttribute("aria-label", "Buchstabe " + L + ", schon benutzt");
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    R.cur = nextAlive(R.cur);
    if (Object.keys(R.used).length === LETTERS.length) {
      // Alle Buchstaben geschafft: neue Kategorie, Buchstaben wieder frei
      R.used = {}; R.cat = nextCategory(); R.flash = "Alle 24 Buchstaben geschafft. Neue Kategorie!";
      letterBtns.forEach(function (b) { b.classList.remove("used"); b.setAttribute("aria-label", "Buchstabe " + b.dataset.l); });
      setTimeout(function () { R.flash = ""; render(); }, 3500);
    }
    if (P.mode === "turn") arm(secondsFor("turn"));
    render();
    say(P.players[R.cur] + " ist dran.");
  }

  function expire() {
    stopClock(); keepAwake(false);
    R.phase = "boom"; R.loser = R.cur;
    R.alive = R.alive.filter(function (i) { return i !== R.loser; });
    if (R.alive.length === 1) {
      R.winner = R.alive[0];
      P.scores[R.winner]++;
      P.starter = R.loser;        // wer verloren hat, beginnt die nächste Runde
      save();
    } else {
      R.winner = -1;
    }
    explode();
    render();
    say("Bumm! " + P.players[R.loser] + " war dran" + (R.winner >= 0 ? ". Punkt für " + P.players[R.winner] + "." : " und ist raus."));
  }

  function newRound() {
    stopClock(); keepAwake(false);
    R.phase = "idle"; R.used = {}; R.cat = nextCategory(); R.loser = -1; R.winner = -1; R.flash = "";
    resetAlive();
    R.cur = P.starter % P.players.length;
    letterBtns.forEach(function (b) { b.classList.remove("used"); b.setAttribute("aria-label", "Buchstabe " + b.dataset.l); });
    render();
  }
  function continueRound() {           // bei mehr als zwei Spielern: der Nächste macht weiter
    R.cur = nextAlive(R.loser);
    R.loser = -1;
    start();
  }

  /* ---------- Explosion ---------- */
  var fx = $("#fx"), flash = $("#flash"), board = $("#board"), clockEl = $("#clock");
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function explode() {
    boomSound();
    if (navigator.vibrate) { try { navigator.vibrate([90, 40, 160]); } catch (e) {} }
    if (flash.animate) flash.animate([{ opacity: 0.85 }, { opacity: 0 }], { duration: reduceMotion ? 400 : 650, easing: "ease-out" });
    if (reduceMotion) return;
    board.classList.remove("shake"); void board.offsetWidth; board.classList.add("shake");

    var dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    fx.width = W * dpr; fx.height = H * dpr;
    var ctx = fx.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = clockEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var red = getComputedStyle(document.documentElement).getPropertyValue("--red").trim() || "#c0392b";
    var colors = [red, red, "#1a2c42", "#6a7d93", "#b8c4d4", "#ffffff"];
    var parts = [];
    for (var i = 0; i < 110; i++) {
      var ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 12;
      parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, s: 3 + Math.random() * 8,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .5, c: colors[i % colors.length], sq: Math.random() < .55 });
    }
    var t0 = performance.now(), DUR = 1300;
    function frame(now) {
      var t = (now - t0) / DUR;
      ctx.clearRect(0, 0, W, H);
      if (t >= 1) return;
      // Druckwelle
      ctx.globalAlpha = Math.max(0, 1 - t * 1.6);
      ctx.strokeStyle = red; ctx.lineWidth = 10 * (1 - t) + 2;
      ctx.beginPath(); ctx.arc(cx, cy, 20 + t * Math.max(W, H) * .75, 0, Math.PI * 2); ctx.stroke();
      // Feuerkern
      ctx.globalAlpha = Math.max(0, 1 - t * 3);
      ctx.fillStyle = red; ctx.beginPath(); ctx.arc(cx, cy, r.width * (.5 + t * 2.2), 0, Math.PI * 2); ctx.fill();
      // Splitter
      ctx.globalAlpha = Math.max(0, 1 - t * t);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .985; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
        if (p.sq) ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
        else { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Buchstaben-Rahmen ---------- */
  var letterBtns = LETTERS.map(function (L) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "letter"; b.dataset.l = L;
    b.innerHTML = "<span>" + L + "</span>";
    b.setAttribute("aria-label", "Buchstabe " + L);
    b.addEventListener("click", function () { pressLetter(L, b); });
    board.appendChild(b);
    return b;
  });
  // Plätze im Uhrzeigersinn um den Rand: oben, rechts, unten, links
  function layout() {
    var portrait = innerHeight >= innerWidth, C = portrait ? 6 : 8, Rw = portrait ? 8 : 6, cells = [];
    for (var c = 1; c <= C; c++) cells.push([1, c]);
    for (var r = 2; r < Rw; r++) cells.push([r, C]);
    for (c = C; c >= 1; c--) cells.push([Rw, c]);
    for (r = Rw - 1; r > 1; r--) cells.push([r, 1]);
    board.style.setProperty("--cols", C);
    board.style.setProperty("--rows", Rw);
    letterBtns.forEach(function (b, i) {
      b.style.gridRow = cells[i][0]; b.style.gridColumn = cells[i][1];
      b.classList.toggle("up", cells[i][0] <= Rw / 2);   // obere Hälfte für die Person gegenüber
    });
  }
  window.addEventListener("resize", layout);
  layout();

  /* ---------- Mitte zeichnen ---------- */
  var up = $("#half-up"), down = $("#half-down"), clockSay = $("#clock-say");
  function scoreLine() {
    return P.players.map(function (n, i) { return esc(n) + " " + P.scores[i]; }).join(" · ");
  }
  function halfHtml(side) {
    var cur = esc(P.players[R.cur]), two = P.players.length === 2;
    // Bei zwei Spielern sitzt Spieler 1 unten, Spieler 2 oben
    var mine = two ? (side === "down" ? 0 : 1) : -1;
    var catBlock = '<p class="label">Kategorie</p><p class="cat">' + esc(R.cat) + "</p>";

    if (R.phase === "boom") {
      var html = '<p class="label red">Bumm!</p><p class="line"><strong>' + esc(P.players[R.loser]) + "</strong> war dran" +
        (R.winner >= 0 ? ". Punkt für <strong>" + esc(P.players[R.winner]) + "</strong>." : " und ist raus.") + "</p>";
      html += '<p class="score">' + scoreLine() + "</p>";
      html += R.winner >= 0
        ? '<button type="button" class="small-btn fill" data-act="new">Nächste Runde</button>'
        : '<button type="button" class="small-btn fill" data-act="go">Weiter mit ' + esc(P.players[nextAlive(R.loser)]) + "</button>";
      return html;
    }
    if (R.flash) return '<p class="label">Geschafft</p><p class="line"><strong>' + esc(R.flash) + "</strong></p>" + catBlock;

    if (R.phase === "idle") {
      if (side === "up") return catBlock + '<p class="line">Uhr antippen zum Starten</p><p class="score">' + scoreLine() + "</p>";
      return catBlock +
        '<div class="mode" role="group" aria-label="Spielweise">' +
          '<button type="button" data-act="mode-turn" aria-pressed="' + (P.mode === "turn") + '">Zeit pro Zug</button>' +
          '<button type="button" data-act="mode-round" aria-pressed="' + (P.mode === "round") + '">Zeit pro Runde</button></div>' +
        '<div class="row"><button type="button" class="small-btn" data-act="cat">Andere Kategorie</button>' +
        '<button type="button" class="small-btn" data-act="settings">Einstellungen</button></div>';
    }
    // run / pause
    var chipOn = two ? mine === R.cur : true;
    var html2 = catBlock + '<span class="chip' + (chipOn ? " on" : "") + '">' + (two && chipOn ? "Du bist dran" : "Dran: " + cur) + "</span>";
    if (R.phase === "pause") html2 += '<p class="line">Pause. Uhr antippen zum Weiterspielen.</p>';
    else html2 += '<p class="score">' + scoreLine() + "</p>";
    return html2;
  }
  function render() {
    up.innerHTML = halfHtml("up");
    down.innerHTML = halfHtml("down");
    board.classList.toggle("idle", R.phase === "idle");
    clockEl.classList.toggle("run", R.phase === "run");
    clockEl.classList.toggle("gone", R.phase === "boom");
    clockSay.hidden = R.phase === "run";
    clockSay.textContent = R.phase === "pause" ? "Weiter" : "Start";
    clockEl.setAttribute("aria-label", R.phase === "run" ? "Uhr läuft. Antippen für Pause." : R.phase === "pause" ? "Pause. Antippen zum Weiterspielen." : "Uhr: Runde starten");
  }

  clockEl.addEventListener("click", function () {
    if (R.phase === "idle") start();
    else if (R.phase === "run") pause();
    else if (R.phase === "pause") resume();
  });
  function onCenter(e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.dataset.act;
    if (act === "new") newRound();
    else if (act === "go") continueRound();
    else if (act === "cat") { R.cat = nextCategory(); render(); }
    else if (act === "settings") openSettings();
    else if (act === "mode-turn" || act === "mode-round") { P.mode = act === "mode-turn" ? "turn" : "round"; save(); render(); }
  }
  up.addEventListener("click", onCenter);
  down.addEventListener("click", onCenter);

  // App im Hintergrund: Runde anhalten, damit niemand unfair explodiert
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });

  /* ---------- Einstellungen ---------- */
  var settings = $("#settings"), plist = $("#plist"), confirmBox = $("#confirm");
  var NOTES = {
    turn: "Jeder gedrückte Buchstabe startet eine neue, geheime Zeit für die nächste Person.",
    round: "Eine geheime Zeit für die ganze Runde. Wer beim Knall dran ist, verliert."
  };
  function renderSettings() {
    document.querySelectorAll("#set-mode button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.mode === P.mode); });
    document.querySelectorAll("#set-tempo button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.tempo === P.tempo); });
    document.querySelectorAll("#set-sound button").forEach(function (b) { b.setAttribute("aria-pressed", (b.dataset.sound === "1") === P.sound); });
    $("#mode-note").textContent = NOTES[P.mode];
    plist.innerHTML = P.players.map(function (n, i) {
      return '<div class="prow"><input type="text" id="pname-' + i + '" value="' + esc(n) + '" maxlength="14" autocomplete="off" aria-label="Name von Spieler ' + (i + 1) + '">' +
        (P.players.length > 2 ? '<button type="button" class="small-btn" data-remove="' + i + '">Entfernen</button>' : "") + "</div>";
    }).join("");
    $("#p-add").disabled = P.players.length >= 8;
  }
  $("#set-mode").addEventListener("click", function (e) { var b = e.target.closest("[data-mode]"); if (b) { P.mode = b.dataset.mode; save(); renderSettings(); render(); } });
  $("#set-tempo").addEventListener("click", function (e) { var b = e.target.closest("[data-tempo]"); if (b) { P.tempo = b.dataset.tempo; save(); renderSettings(); } });
  $("#set-sound").addEventListener("click", function (e) { var b = e.target.closest("[data-sound]"); if (b) { P.sound = b.dataset.sound === "1"; save(); renderSettings(); if (P.sound) tick(); } });
  plist.addEventListener("input", function (e) {
    var m = /^pname-(\d+)$/.exec(e.target.id);
    if (!m) return;
    P.players[+m[1]] = e.target.value.trim() || "Spieler " + (+m[1] + 1);
    save(); render();
  });
  plist.addEventListener("click", function (e) {
    var b = e.target.closest("[data-remove]");
    if (!b) return;
    var i = +b.dataset.remove;
    P.players.splice(i, 1); P.scores.splice(i, 1);
    P.starter = P.starter % P.players.length;
    save(); renderSettings(); newRound();
  });
  $("#p-add").addEventListener("click", function () {
    if (P.players.length >= 8) return;
    P.players.push("Spieler " + (P.players.length + 1)); P.scores.push(0);
    save(); renderSettings(); newRound();
    var inp = $("#pname-" + (P.players.length - 1)); if (inp) { inp.focus(); inp.select(); }
  });
  $("#reset").addEventListener("click", function () { confirmBox.hidden = false; });
  $("#confirm-no").addEventListener("click", function () { confirmBox.hidden = true; });
  $("#confirm-yes").addEventListener("click", function () {
    P.scores = P.players.map(function () { return 0; }); save(); confirmBox.hidden = true; render();
  });
  function openSettings() { renderSettings(); confirmBox.hidden = true; settings.hidden = false; $("#settings-done").focus(); }
  function closeSettings() { settings.hidden = true; render(); }
  $("#settings-done").addEventListener("click", closeSettings);
  settings.addEventListener("click", function (e) { if (e.target === settings) closeSettings(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !settings.hidden) closeSettings(); });

  var announce = $("#announce");
  function say(text) { announce.textContent = ""; if (text) setTimeout(function () { announce.textContent = text; }, 30); }

  render();

  // Offline-Speicher: lädt die App einmal komplett aufs Gerät.
  // Kommt ein Update, lädt die App neu, aber nie mitten in einer laufenden Runde.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && !reloaded && R.phase === "idle") { reloaded = true; location.reload(); }
    });
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
